<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
      <div class="container-fluid">
        <a class="navbar-brand" href="#">EduSubmit</a>
        <div class="ms-auto">
          <a class="btn btn-outline-light" href="{{ url_for('auth_logout') }}">Logout</a>
        </div>
      </div>
    </nav>
    <div class="container py-4">
      <h2 class="mb-4">Welcome, {{ user.name }}</h2>
      <div class="row g-4">
        <div class="col-md-3"><div class="card shadow-sm rounded-4 p-3"><h5>Total Assignments</h5><h2>{{ totalAssignments }}</h2></div></div>
        <div class="col-md-3"><div class="card shadow-sm rounded-4 p-3"><h5>Submitted</h5><h2>{{ submittedAssignments }}</h2></div></div>
        <div class="col-md-3"><div class="card shadow-sm rounded-4 p-3"><h5>Pending</h5><h2>{{ pendingAssignments }}</h2></div></div>
        <div class="col-md-3"><div class="card shadow-sm rounded-4 p-3"><h5>Graded</h5><h2>{{ gradedAssignments }}</h2></div></div>
      </div>
      <div class="mt-4">
        <a class="btn btn-primary" href="{{ url_for('student_assignments') }}">View Assignments</a>
        <a class="btn btn-outline-secondary" href="{{ url_for('student_marks') }}">View Marks</a>
      </div>
    </div>
  </body>
</html>

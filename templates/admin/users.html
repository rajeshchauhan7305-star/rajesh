<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Manage Users</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  </head>
  <body>
    <div class="container py-4">
      <h2 class="mb-4">Manage Users</h2>
      <div class="card mb-4 p-4">
        <h5>Create User</h5>
        <form action="{{ url_for('admin_create_user') }}" method="post">
          <div class="row g-3">
            <div class="col-md-3"><input class="form-control" name="name" placeholder="Full Name" required /></div>
            <div class="col-md-3"><input class="form-control" name="email" type="email" placeholder="Email" required /></div>
            <div class="col-md-2"><input class="form-control" name="password" type="password" placeholder="Password" required /></div>
            <div class="col-md-2">
              <select class="form-select" name="role">
                <option value="student">Student</option>
                <option value="teacher">Teacher</option>
                <option value="admin">Admin</option>
              </select>
            </div>
            <div class="col-md-2"><button class="btn btn-dark w-100">Create</button></div>
          </div>
        </form>
      </div>
      <table class="table table-striped">
        <thead>
          <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Role</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          {% for user in users %}
            <tr>
              <td>{{ user.name }}</td>
              <td>{{ user.email }}</td>
              <td>{{ user.role }}</td>
              <td>
                <form action="{{ url_for('admin_delete_user', user_id=user.user_id) }}" method="post" class="d-inline">
                  <button class="btn btn-danger btn-sm">Delete</button>
                </form>
              </td>
            </tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
  </body>
</html>

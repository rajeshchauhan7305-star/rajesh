<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Submissions</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  </head>
  <body>
    <div class="container py-4">
      <h2 class="mb-4">Student Submissions</h2>
      <table class="table table-striped">
        <thead>
          <tr>
            <th>Student</th>
            <th>Assignment</th>
            <th>Status</th>
            <th>Marks</th>
            <th>Feedback</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody>
          {% for submission in submissions %}
            <tr>
              <td>{{ submission.name }}</td>
              <td>{{ submission.title }}</td>
              <td>{{ submission.status }}</td>
              <td>{{ submission.marks_obtained or 'Pending' }}</td>
              <td>{{ submission.teacher_feedback or 'No feedback yet' }}</td>
              <td>
                <form action="{{ url_for('teacher_evaluate_submission', submission_id=submission.submission_id) }}" method="post">
                  <input class="form-control form-control-sm mb-2" name="marks_obtained" placeholder="Marks" />
                  <input class="form-control form-control-sm mb-2" name="teacher_feedback" placeholder="Feedback" />
                  <button class="btn btn-success btn-sm">Save</button>
                </form>
              </td>
            </tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
  </body>
</html>
